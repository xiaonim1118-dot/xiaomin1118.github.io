
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Min. | My Individual Notebook</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #f1eee6;
  color: #292820;
  font-family: 'DM Sans', sans-serif;
  height: 100vh;
  overflow: hidden;
}

.page {
  height: 100vh;
  min-height: 500px;
  padding: 32px 5vw;
  display: flex;
  flex-direction: column;
}

header, footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 10px;
  letter-spacing: 2px;
  color: #88847a;
}

header {
  border-bottom: 1px solid #d4d0c7;
  padding-bottom: 20px;
}

main {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: visible;
}

.stage {
  position: relative;
  width: 100%;
  max-width: 1100px;
  height: 180px;
}

.title {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  align-items: baseline;
  white-space: nowrap;
  font-size: clamp(28px, 5.2vw, 64px);
  font-weight: 400;
  letter-spacing: -2px;
}

.greeting {
  display: flex;
  align-items: baseline;
  gap: 0.2em;
  margin-right: 0.18em;
}

.name {
  position: relative;
  display: inline-flex;
  align-items: baseline;
  gap: 0;
}

.letter {
  position: relative;
  display: inline-block;
  font-weight: 700;
  color: #292820;
  cursor: grab;
  user-select: none;
  touch-action: none;
  z-index: 2;
}

.letter:active {
  cursor: grabbing;
}

.word-rest {
  display: inline-block;
  max-width: 0;
  opacity: 0;
  overflow: hidden;
  font-weight: 400;
  color: #69665e;
  transition: none;
}

.hint {
  position: absolute;
  top: calc(50% + 75px);
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  letter-spacing: 2px;
  color: #99948a;
  white-space: nowrap;
  transition: opacity .3s;
}

.stage.done .hint {
  opacity: 0;
}

footer {
  border-top: 1px solid #d4d0c7;
  padding-top: 20px;
}

@media(max-width: 600px) {
  .page {
    padding: 24px 5vw;
  }

  .title {
    font-size: 5.1vw;
    letter-spacing: -1px;
  }

  .greeting {
    gap: 0.12em;
  }

  .hint {
    top: calc(50% + 55px);
  }
}
</style>
</head>

<body>

<div class="page">

<header>
  <span>MIN.</span>
  <span>PERSONAL ARCHIVE · 2026</span>
</header>

<main>
  <div class="stage" id="stage">

    <div class="title" id="title">

      <span class="greeting" id="greeting">
        Hi, I'm
      </span>

      <span class="name" id="name">

        <span class="letter" id="M">M</span>
        <span class="word-rest" id="y">y</span>

        <span class="letter" id="I">i</span>
        <span class="word-rest" id="individual">ndividual</span>

        <span class="letter" id="N">n</span>
        <span class="word-rest" id="notebook">otebook.</span>

      </span>

    </div>

    <div class="hint" id="hint">
      HOLD MIN & SLIDE TO THE RIGHT →
    </div>

  </div>
</main>

<footer>
  <span>PHOTOGRAPHY · TRAVEL · THOUGHTS</span>
  <span>001 / INTRODUCTION</span>
</footer>

</div>

<script>
const stage = document.getElementById('stage');
const title = document.getElementById('title');
const greeting = document.getElementById('greeting');

const M = document.getElementById('M');
const I = document.getElementById('I');
const N = document.getElementById('N');

const y = document.getElementById('y');
const individual = document.getElementById('individual');
const notebook = document.getElementById('notebook');

let progress = 0;
let dragging = false;
let startX = 0;
let startProgress = 0;

const maxProgress = 1;
const dragDistance = 280;

function smooth(value) {
  return value * value * (3 - 2 * value);
}

function render() {
  const p = smooth(progress);

  // 原始名字逐渐展开成三个单词
  const spread = p * 1;

  M.style.transform = `translateX(0px)`;

  I.style.transform = `translateX(${spread * 55}px)`;
  N.style.transform = `translateX(${spread * 130}px)`;

  // 后续文字逐渐显现
  function reveal(element, amount) {
    element.style.maxWidth = (element.scrollWidth * amount) + 'px';
    element.style.opacity = amount;
  }

  reveal(y, p);
  reveal(individual, p);
  reveal(notebook, p);

  // i 和 n 在完成后变为大写
  I.textContent = progress >= 0.98 ? 'I' : 'i';
  N.textContent = progress >= 0.98 ? 'N' : 'n';

  greeting.style.opacity = 1 - p;

  stage.classList.toggle('done', progress >= 0.98);
}

function beginDrag(e, element) {
  if (progress >= 0.98) return;

  dragging = true;
  startX = e.clientX;
  startProgress = progress;

  element.setPointerCapture(e.pointerId);
}

function moveDrag(e) {
  if (!dragging) return;

  const distance = e.clientX - startX;

  progress = Math.max(
    0,
    Math.min(1, startProgress + distance / dragDistance)
  );

  render();
}

function endDrag() {
  if (!dragging) return;

  dragging = false;

  if (progress >= 0.5) {
    progress = 1;
  } else {
    progress = 0;
  }

  animateToTarget(progress);
}

function animateToTarget(target) {
  const initial = progress;
  const startTime = performance.now();
  const duration = 450;

  function step(now) {
    const t = Math.min(1, (now - startTime) / duration);
    const eased = smooth(t);

    progress = initial + (target - initial) * eased;
    render();

    if (t < 1) {
      requestAnimationFrame(step);
    }
  }

  requestAnimationFrame(step);
}

[M, I, N].forEach(element => {
  element.addEventListener('pointerdown', e => {
    beginDrag(e, element);
  });

  element.addEventListener('pointermove', moveDrag);
  element.addEventListener('pointerup', endDrag);
  element.addEventListener('pointercancel', endDrag);
});

render();
</script>

</body>
</html>
