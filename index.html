
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Min. | Individual Notebook</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:ital,wght@1,400&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #f1eee6;
  color: #292820;
  font-family: 'DM Sans', sans-serif;
  overflow: hidden;
  height: 100vh;
}

.page {
  height: 100vh;
  min-height: 500px;
  padding: 32px 5vw;
  display: flex;
  flex-direction: column;
}

header, footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 10px;
  letter-spacing: 2px;
  color: #88847a;
}

header {
  border-bottom: 1px solid #d4d0c7;
  padding-bottom: 20px;
}

main {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
}

.stage {
  position: relative;
  width: 100%;
  text-align: center;
}

.intro {
  font-family: 'Playfair Display', serif;
  font-size: clamp(38px, 7vw, 76px);
  font-weight: 400;
  white-space: nowrap;
}

.min {
  font-style: italic;
  cursor: grab;
  display: inline-block;
  touch-action: none;
  user-select: none;
}

.min:active {
  cursor: grabbing;
}

.final-title {
  display: none;
  align-items: baseline;
  justify-content: center;
  gap: 0.12em;
  white-space: nowrap;
  font-size: clamp(22px, 4.5vw, 52px);
  letter-spacing: -1.5px;
}

.word {
  display: inline-flex;
  align-items: baseline;
}

.initial {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 1.12em;
}

.rest {
  font-family: 'DM Sans', sans-serif;
  font-weight: 400;
  overflow: hidden;
  max-width: 0;
  opacity: 0;
  transition:
    max-width 0.65s ease,
    opacity 0.5s ease;
}

.stage.done .intro {
  display: none;
}

.stage.done .final-title {
  display: flex;
}

.stage.done .rest {
  max-width: 250px;
  opacity: 1;
}

.stage.done .word:nth-child(2) .rest {
  transition-delay: .15s;
}

.stage.done .word:nth-child(3) .rest {
  transition-delay: .3s;
}

.hint {
  margin-top: 40px;
  font-size: 10px;
  letter-spacing: 2px;
  color: #99948a;
  transition: opacity .3s;
}

.stage.done .hint {
  opacity: 0;
}

footer {
  border-top: 1px solid #d4d0c7;
  padding-top: 20px;
}

@media(max-width: 600px) {
  .page {
    padding: 24px 5vw;
  }

  .intro {
    font-size: 42px;
  }

  .final-title {
    font-size: clamp(19px, 5vw, 29px);
    letter-spacing: -1px;
    gap: 0.08em;
  }
}
</style>
</head>

<body>
<div class="page">

<header>
  <span>MIN.</span>
  <span>PERSONAL ARCHIVE · 2026</span>
</header>

<main>
  <div class="stage" id="stage">

    <div class="intro">
      Hi, I'm
      <span class="min" id="min">Min.</span>
    </div>

    <div class="final-title">
      <span class="word">
        <span class="initial">M</span><span class="rest">y</span>
      </span>

      <span class="word">
        <span class="initial">I</span><span class="rest">ndividual</span>
      </span>

      <span class="word">
        <span class="initial">N</span><span class="rest">otebook.</span>
      </span>
    </div>

    <div class="hint" id="hint">
      HOLD & SLIDE TO THE RIGHT →
    </div>

  </div>
</main>

<footer>
  <span>PHOTOGRAPHY · TRAVEL · THOUGHTS</span>
  <span>001 / INTRODUCTION</span>
</footer>

</div>

<script>
const min = document.getElementById('min');
const stage = document.getElementById('stage');

let startX = 0;
let dragging = false;
let currentX = 0;

const threshold = 150;

min.addEventListener('pointerdown', (e) => {
  if (stage.classList.contains('done')) return;

  dragging = true;
  startX = e.clientX;
  min.setPointerCapture(e.pointerId);
});

min.addEventListener('pointermove', (e) => {
  if (!dragging) return;

  currentX = Math.max(0, e.clientX - startX);
  min.style.transform = `translateX(${currentX}px)`;

  if (currentX >= threshold) {
    dragging = false;
    stage.classList.add('done');
  }
});

function reset() {
  if (!dragging) return;

  dragging = false;
  min.style.transition = 'transform .3s ease';
  min.style.transform = 'translateX(0)';

  setTimeout(() => {
    min.style.transition = '';
  }, 300);
}

min.addEventListener('pointerup', reset);
min.addEventListener('pointercancel', reset);
</script>
</body>
</html>
