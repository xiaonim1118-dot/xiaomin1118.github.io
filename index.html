
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Min. | Individual Notebook</title>
  <meta name="description" content="A personal visual archive of photography, travels and thoughts.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f1eee6;
      color: #292820;
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
      height: 100vh;
    }

    .page {
      height: 100vh;
      min-height: 500px;
      position: relative;
      padding: 32px 5vw;
      display: flex;
      flex-direction: column;
    }

    header, footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      letter-spacing: 2px;
      color: #88847a;
    }

    header {
      border-bottom: 1px solid #d4d0c7;
      padding-bottom: 20px;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .stage {
      position: relative;
      width: min(850px, 90vw);
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .intro {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 14px;
      white-space: nowrap;
      font-family: 'Playfair Display', serif;
      font-size: clamp(38px, 7vw, 76px);
      font-weight: 400;
    }

    .min {
      font-style: italic;
      cursor: grab;
      touch-action: none;
      user-select: none;
      position: relative;
      z-index: 3;
      transition: color .25s;
    }

    .min:active {
      cursor: grabbing;
    }

    .reveal {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      font-family: 'Playfair Display', serif;
      font-size: clamp(35px, 6vw, 68px);
      white-space: nowrap;
      transition: opacity .35s ease;
    }

    .reveal em {
      font-weight: 400;
    }

    .stage.done .reveal {
      opacity: 1;
    }

    .stage.done .intro {
      opacity: 0;
      pointer-events: none;
      transition: opacity .4s ease;
    }

    .hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      letter-spacing: 2px;
      color: #99948a;
      white-space: nowrap;
      transition: opacity .3s;
    }

    .stage.done .hint {
      opacity: 0;
    }

    footer {
      border-top: 1px solid #d4d0c7;
      padding-top: 20px;
    }

    @media (max-width: 600px) {
      .page {
        padding: 24px 6vw;
      }

      .intro {
        gap: 8px;
        font-size: clamp(32px, 8vw, 48px);
      }

      .reveal {
        white-space: normal;
        font-size: 38px;
        line-height: 1.25;
      }

      .stage {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <header>
      <span>MIN.</span>
      <span>PERSONAL ARCHIVE · 2026</span>
    </header>

    <main>
      <div class="stage" id="stage">

        <div class="intro" id="intro">
          <span>Hi, I'm</span>
          <span class="min" id="min">Min.</span>
        </div>

        <div class="reveal">
          My Individual<br>
          <em>Notebook.</em>
        </div>

        <div class="hint" id="hint">
          HOLD & SLIDE TO THE RIGHT →
        </div>

      </div>
    </main>

    <footer>
      <span>PHOTOGRAPHY · TRAVEL · THOUGHTS</span>
      <span>001 / INTRODUCTION</span>
    </footer>

  </div>

  <script>
    const min = document.getElementById('min');
    const stage = document.getElementById('stage');

    let startX = 0;
    let currentX = 0;
    let dragging = false;

    const threshold = 150;

    min.addEventListener('pointerdown', (e) => {
      if (stage.classList.contains('done')) return;

      dragging = true;
      startX = e.clientX;
      min.setPointerCapture(e.pointerId);
      min.style.transition = 'none';
    });

    min.addEventListener('pointermove', (e) => {
      if (!dragging) return;

      currentX = Math.max(0, Math.min(e.clientX - startX, 250));

      min.style.transform = `translateX(${currentX}px)`;

      if (currentX >= threshold) {
        finish();
      }
    });

    function finish() {
      dragging = false;
      min.style.transition = 'transform .4s ease, opacity .4s ease';
      min.style.transform = 'translateX(250px)';
      min.style.opacity = '0';

      stage.classList.add('done');
    }

    function reset() {
      if (stage.classList.contains('done')) return;

      dragging = false;
      min.style.transition = 'transform .3s ease';
      min.style.transform = 'translateX(0)';
    }

    min.addEventListener('pointerup', reset);
    min.addEventListener('pointercancel', reset);
    min.addEventListener('lostpointercapture', () => {
      if (!stage.classList.contains('done')) reset();
    });
  </script>

</body>
</html>
